<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizhill — panel</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 16px; color: #222; }
      h1, h2 { margin-bottom: 8px; }
      form, .box { background: #f4f6f8; padding: 16px; border-radius: 8px; margin: 16px 0; }
      label { display: block; margin-top: 10px; font-weight: bold; }
      input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
      button { margin-top: 16px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      td, th { border-bottom: 1px solid #ddd; text-align: left; padding: 6px; font-size: 14px; }
      .ok { background: #e6f6ea; padding: 10px; border-radius: 6px; }
      .hint { color: #555; font-size: 14px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .q { border: 1px solid #ddd; padding: 10px; margin-top: 10px; background: #fff; }
    </style>
  </head>
  <body>
    <h1>Quizhill — dodawanie treści</h1>
    <p class="hint">To jest bardzo prosty panel. Wpisz dane i kliknij przycisk. Nic nie trzeba znać.</p>
    {% if saved %}<p class="ok">Zapisano: {{ saved }}</p>{% endif %}
    {% block body %}{% endblock %}
  </body>
</html>
