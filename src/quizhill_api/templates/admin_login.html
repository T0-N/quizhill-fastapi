<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Logowanie panelu</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 420px; margin: 80px auto; }
      input, button { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>Panel Quizhill</h1>
    <p>Wpisz hasło z pliku .env (domyślnie: quizhill).</p>
    <form method="post" action="/admin/login">
      <input type="password" name="password" placeholder="Hasło" />
      <button type="submit">Wejdź</button>
    </form>
  </body>
</html>
