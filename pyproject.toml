[project]
name = "quizhill-api"
version = "0.1.0"
description = "API Quizhill: FastAPI + PostgreSQL (Neon / lokalny Docker)"
readme = "README.md"
authors = [
    { name = "Tomasz Nowak", email = "tomasz.adam.nowak@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "google-auth>=2.36",
    "greenlet>=3.1",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
quizhill-api = "quizhill_api.main:run"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
